<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Tài khoản mới</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 24px;">
  <div style="max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 8px; padding: 32px;">
    <h2 style="color: #1a73e8;">Xin chào {{FullName}},</h2>
    <p>Tài khoản của bạn trên hệ thống <strong>ETR Management</strong> đã được tạo thành công.</p>
    <table style="width: 100%; margin: 16px 0; border-collapse: collapse;">
      <tr>
        <td style="padding: 8px 0; color: #666;">Tên đăng nhập:</td>
        <td style="padding: 8px 0; font-weight: bold;">{{Username}}</td>
      </tr>
      <tr>
        <td style="padding: 8px 0; color: #666;">Mật khẩu tạm thời:</td>
        <td style="padding: 8px 0; font-weight: bold;">{{TemporaryPassword}}</td>
      </tr>
    </table>
    <p>Vui lòng đăng nhập và đổi mật khẩu ngay trong lần đăng nhập đầu tiên.</p>
    <p style="color: #999; font-size: 12px; margin-top: 24px;">Đây là email tự động, vui lòng không phản hồi.</p>
  </div>
</body>
</html>
